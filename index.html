<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Atividades do Agito</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap">
<style>
/* Layout: backoffice Appai Digital — sidebar escura fixa (gaveta abaixo de 1280px), toolbar 64, page header 112, cards sobre canvas cinza. Tokens do DS Appai Digital v0.1.0. */
:root{
  --canvas:#F5F5F5; --surface:#FFFFFF; --subtle:#FAFAFA; --header:#C5C6CB; --selected:#ECECEE; --hover:rgba(0,0,0,.04);
  --text:rgba(0,0,0,.87); --text2:rgba(0,0,0,.64); --text3:rgba(0,0,0,.38);
  --border:rgba(0,0,0,.12); --border-strong:rgba(0,0,0,.42);
  --action:#3C4252; --action-hover:#2D323E; --action-active:#1E2129; --on-action:#FFFFFF; --link:#3C4252;
  --danger:#C62828; --danger-btn:#D32F2F; --danger-btn-hover:#C62828;
  --succ:#15803D; --succ-bg:#DCFCE7; --dang-bg:#FFEBEE; --dang-bd:#F44336;
  --warn:#92400E; --warn-bg:#FFF8E1; --warn-bd:#FFC107;
  --info:#01579B; --info-bg:#E1F5FE; --info-bd:#039BE5;
  --neu:#2D323E; --neu-bg:#ECECEE;
  --side:#1E2129; --side-raised:#2D323E; --side-text:rgba(255,255,255,.7); --side-on:#FFFFFF;
  --brand:#EC6916; --brand-text:#C2410C;
  --overlay:rgba(0,0,0,.32); --snack:#1E2129; --snack-text:#FFFFFF; --snack-action:#FEF3EB;
  --shadow-1:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.10);
  --shadow-24:0 11px 15px -7px rgba(0,0,0,.2),0 24px 38px 3px rgba(0,0,0,.14),0 9px 46px 8px rgba(0,0,0,.12);
  --font:'Mulish','Muli',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gut:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --canvas:#15171C; --surface:#1E2129; --subtle:#23262E; --header:#2D323E; --selected:#353A48; --hover:rgba(255,255,255,.05);
  --text:rgba(255,255,255,.9); --text2:rgba(255,255,255,.68); --text3:rgba(255,255,255,.4);
  --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.45);
  --action:#C5C6CB; --action-hover:#ECECEE; --action-active:#FFFFFF; --on-action:#1E2129; --link:#C5C6CB;
  --danger:#FF8A80; --succ:#86EFAC; --succ-bg:rgba(22,163,74,.2); --dang-bg:rgba(244,67,54,.18); --dang-bd:#EF5350;
  --warn:#FCD34D; --warn-bg:rgba(255,193,7,.14); --warn-bd:#FFC107; --info:#7DD3FC; --info-bg:rgba(3,155,229,.16); --info-bd:#039BE5;
  --neu:#ECECEE; --neu-bg:#353A48; --side:#111318; --side-raised:#1E2129;
  --overlay:rgba(0,0,0,.6); --snack:#ECECEE; --snack-text:#1E2129; --snack-action:#3C4252;
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --canvas:#15171C; --surface:#1E2129; --subtle:#23262E; --header:#2D323E; --selected:#353A48; --hover:rgba(255,255,255,.05);
  --text:rgba(255,255,255,.9); --text2:rgba(255,255,255,.68); --text3:rgba(255,255,255,.4);
  --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.45);
  --action:#C5C6CB; --action-hover:#ECECEE; --action-active:#FFFFFF; --on-action:#1E2129; --link:#C5C6CB;
  --danger:#FF8A80; --succ:#86EFAC; --succ-bg:rgba(22,163,74,.2); --dang-bg:rgba(244,67,54,.18); --dang-bd:#EF5350;
  --warn:#FCD34D; --warn-bg:rgba(255,193,7,.14); --warn-bd:#FFC107; --info:#7DD3FC; --info-bg:rgba(3,155,229,.16); --info-bd:#039BE5;
  --neu:#ECECEE; --neu-bg:#353A48; --side:#111318; --side-raised:#1E2129;
  --overlay:rgba(0,0,0,.6); --snack:#ECECEE; --snack-text:#1E2129; --snack-action:#3C4252;
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
  color-scheme:dark;
}
@media (min-width:960px){ :root{ --gut:30px } }

*{box-sizing:border-box}
body{background:var(--canvas);color:var(--text);font:400 14px/20px var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
a{color:var(--link)}
h1,h2,h3{text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;text-transform:none;letter-spacing:normal;width:1em;overflow:hidden;flex:none}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.side{position:fixed;top:0;bottom:0;left:0;width:280px;background:var(--side);z-index:50;overflow-y:auto;padding-left:env(safe-area-inset-left,0px);padding-top:env(safe-area-inset-top,0px);transform:translateX(-100%);transition:transform .3s cubic-bezier(.25,.8,.25,1);visibility:hidden}
.side.open{transform:none;visibility:visible}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:45}
.brandbar{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--side-raised)}
.brandbar b{font:700 18px/22px var(--font);color:#fff;display:block}
.brandbar small{font:400 12px/16px var(--font);color:var(--side-text);display:block}
.navlist{padding:8px 12px 24px;display:flex;flex-direction:column;gap:2px}
.overline{font:700 11px/16px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--side-text);padding:16px 12px 8px}
.nav-item{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:4px;color:var(--side-text);text-decoration:none;font:400 14px/20px var(--font);border:0;background:none;width:100%;text-align:left;cursor:pointer}
.nav-item:hover{background:var(--side-raised);color:var(--side-on)}
.nav-item[aria-current="page"]{background:#fff;color:#C2410C;font-weight:600}
.nav-item:focus-visible{outline-color:#fff}
.col{min-width:0;display:flex;flex-direction:column;min-height:100%}
@media (min-width:1280px){ .side{transform:none;visibility:visible} .col{margin-left:calc(280px + env(safe-area-inset-left,0px))} .menu-btn{display:none!important} .scrim{display:none} }
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.top .spacer{flex:1}
.user{display:inline-flex;align-items:center;gap:8px;font:600 14px/20px var(--font);color:var(--text);background:none;border:0;padding:0 8px;height:40px;border-radius:4px;cursor:pointer;min-width:0}
.user span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user:hover{background:var(--selected)}
.ph{background:var(--header)}
.ph-in{min-height:112px;padding-block:20px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.ph-txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font:400 14px/20px var(--font);color:var(--text)}
.crumbs a{color:var(--text);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--border-strong)}
.crumbs .ms{font-size:16px;color:var(--text2)}
.ph h1{margin:0;font:600 24px/32px var(--font)}
.ph h1:focus{outline:none}
.ph-actions{display:flex;flex-wrap:wrap;gap:12px}
main{padding-block:var(--gut) 48px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px;width:100%;max-width:1600px}
main.narrow{max-width:1180px}

/* Components */
.btn{font:600 14px/20px var(--font);height:36px;padding:0 16px;border-radius:4px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s}
.btn .ms{font-size:18px}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-primary{background:var(--action);color:var(--on-action)}.btn-primary:hover{background:var(--action-hover)}.btn-primary:active{background:var(--action-active)}
.btn-secondary{background:var(--surface);color:var(--action);border-color:var(--action)}.btn-secondary:hover{background:var(--selected)}
.btn-ghost{background:transparent;color:var(--action)}.btn-ghost:hover{background:var(--selected)}
.btn-danger{background:var(--danger-btn);color:#fff}.btn-danger:hover{background:var(--danger-btn-hover)}
.btn[disabled]{background:var(--border);color:var(--text3);border-color:transparent;cursor:not-allowed}
.ibtn{width:34px;height:34px;border-radius:4px;border:0;background:transparent;color:var(--action);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;text-decoration:none;flex:none}
.ibtn:hover{background:var(--selected)}
.ibtn.danger{color:var(--danger)}
.ibtn.lg{width:44px;height:44px}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-1)}
.card-pad{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.card h2{margin:0;font:600 16px/24px var(--font)}
.help{margin:0;font:400 12px/17px var(--font);color:var(--text2)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font:600 13px/18px var(--font);color:var(--text2)}
.req{color:var(--danger)}
.input,select.input,textarea.input{height:40px;border:1px solid var(--border-strong);border-radius:4px;padding:0 12px;font:400 14px/20px var(--font);color:var(--text);background:var(--surface);width:100%;min-width:0}
textarea.input{height:auto;min-height:96px;padding:10px 12px;resize:vertical}
.input:hover{border-color:var(--text)}
.input:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 1px var(--action)}
.input[aria-invalid="true"]{border-color:var(--dang-bd);box-shadow:0 0 0 1px var(--dang-bd)}
.input[disabled]{background:var(--subtle);color:var(--text3)}
.err{display:flex;gap:4px;align-items:center;font:400 12px/16px var(--font);color:var(--danger)}
.err .ms{font-size:16px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font:600 12px/16px var(--font);white-space:nowrap}
.b-succ{background:var(--succ-bg);color:var(--succ)} .b-dang{background:var(--dang-bg);color:var(--danger)} .b-neu{background:var(--neu-bg);color:var(--neu)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:8px;border:1px solid;font:400 14px/20px var(--font)}
.alert .ms{margin-top:0}
.a-info{background:var(--info-bg);border-color:var(--info-bd);color:var(--info)}
.a-warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}
.a-dang{background:var(--dang-bg);border-color:var(--dang-bd);color:var(--danger)}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--border);border-radius:4px;background:var(--surface);flex-wrap:wrap}
.seg button{height:30px;padding:0 14px;border:0;background:transparent;font:600 13px/18px var(--font);color:var(--text2);cursor:pointer;border-radius:3px}
.seg button:hover{background:var(--selected)}
.seg button[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 12px;border-radius:999px;background:var(--selected);font:600 13px/18px var(--font);color:var(--text)}
.chip .ms{font-size:16px}
.chip button{width:24px;height:24px;border-radius:999px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);padding:0}
.chip button:hover{background:var(--header)}
.chip.plain{padding-right:12px}
.chip.sold{background:var(--dang-bg);color:var(--danger);text-decoration:line-through}
.sw{width:36px;height:20px;border-radius:999px;background:var(--text3);border:0;position:relative;cursor:pointer;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s cubic-bezier(.25,.8,.25,1)}
.sw[aria-checked="true"]{background:var(--action)}
.sw[aria-checked="true"]::after{left:18px}
.kv{display:flex;flex-wrap:wrap;gap:12px 40px}
.kv>div{display:flex;flex-direction:column;min-width:0}
.kv span:last-child{font:400 14px/20px var(--font);overflow-wrap:anywhere}
.bar{height:4px;border-radius:999px;background:var(--selected);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--action)}
.bar.full>i{background:var(--danger)}
.empty{padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.empty > .ms{font-size:36px;width:auto;color:var(--text3)}
.empty strong{font:600 16px/24px var(--font)}

/* Filter bar */
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px}
.filters .f-grow{flex:2 1 220px}.filters .f{flex:1 1 180px}

/* Table */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font:600 13px/18px var(--font);color:var(--text2);text-align:left;padding:0 16px;height:48px;background:var(--subtle);border-block:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl .r{text-align:right}
.tbl .c-exp{width:56px;padding:0 8px;text-align:center}
.tbl tbody.is-open>tr:first-child{background:var(--selected)}
.tbl tbody>tr:first-child:hover{background:var(--hover)}
.tbl tbody.is-open>tr:first-child:hover{background:var(--selected)}
.t-name{font-weight:600;display:block}
.t-sub{font:400 12px/16px var(--font);color:var(--text2);display:block}
td.t-sub{display:table-cell;font-size:14px;line-height:20px}
.acts{display:flex;justify-content:flex-end;gap:2px}
.subrow>td{background:var(--subtle);padding:4px 24px 16px 72px}
.subtbl{width:100%;border-collapse:collapse}
.subtbl th{font:600 12px/16px var(--font);color:var(--text2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);background:transparent;height:auto}
.subtbl td{padding:10px 12px;border-bottom:1px solid var(--border);font:400 14px/20px var(--font)}
.tfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:12px 16px;padding:12px 24px;font:400 12px/16px var(--font);color:var(--text2)}
@media (max-width:900px){
  .tbl.stack{min-width:0}
  .tbl.stack thead{display:none}
  .tbl.stack tbody>tr:first-child{display:grid;grid-template-columns:44px 1fr;padding:12px 8px 12px 4px;border-bottom:1px solid var(--border)}
  .tbl.stack tbody>tr:first-child>td{border:0;padding:4px 8px}
  .tbl.stack td.c-exp{grid-row:1 / span 6;align-self:start;padding:0}
  .tbl.stack td[data-label]::before{content:attr(data-label);display:block;font:600 11px/16px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--text2)}
  .tbl.stack td.acts-cell .acts{justify-content:flex-start}
  .subrow>td{padding:4px 12px 12px}
  .subtbl.stack thead{display:none}
  .subtbl.stack tr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 0;border-bottom:1px solid var(--border)}
  .subtbl.stack td{border:0;padding:0}
}

/* Cadastro */
.stepper{list-style:none;margin:0;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.stepper li{display:flex;align-items:center;gap:8px;font:600 14px/20px var(--font)}
.stepper .dot{width:28px;height:28px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;border:1px solid var(--border-strong);color:var(--text2)}
.stepper .line{flex:1 1 32px;min-width:24px;height:1px;background:var(--border)}
.stepper li.done{color:var(--succ)} .stepper li.done .dot{background:var(--succ);border-color:var(--succ);color:var(--surface)}
.stepper li.cur .dot{background:var(--action);border-color:var(--action);color:var(--on-action)}
.stepper li.pend{color:var(--text2);font-weight:400}
.stepper button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:4px}
.stepper button:focus-visible{outline:2px solid var(--action);outline-offset:4px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
.formgrid .full{grid-column:1 / -1}
@media (max-width:600px){ .formgrid{grid-template-columns:minmax(0,1fr)} }
.radios-f{border:0;margin:0;padding:0}
.radios-f legend{padding:0;margin-bottom:4px}
.radios{display:flex;flex-wrap:wrap;gap:4px 24px}
.radios label{display:inline-flex;align-items:center;gap:8px;min-height:40px;font:400 14px/20px var(--font);color:var(--text);cursor:pointer}
.radios input{width:18px;height:18px;margin:0;accent-color:var(--action)}
.kitbox.kitret{grid-template-columns:minmax(0,1fr) auto;align-items:start}
.kitrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 24px;align-items:start}
@media (max-width:900px){ .kitrow{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:600px){ .kitrow{grid-template-columns:minmax(0,1fr)} }
.tl-req{padding:1px 8px;font-size:11px;margin-left:4px;vertical-align:1px}
.kitret .kr-ok{padding-top:26px}
@media (max-width:600px){ .kitbox.kitret{grid-template-columns:minmax(0,1fr) auto} }
.kitbox.kitlist{display:flex;flex-direction:column;gap:12px}
.kitbox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px;padding:16px;background:var(--subtle);border:1px solid var(--border);border-radius:8px}
@media (max-width:600px){ .kitbox{grid-template-columns:minmax(0,1fr)} }
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px 32px}
.pgrp{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.pgrp legend{font:600 14px/20px var(--font);padding:0;margin-bottom:8px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.pair.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:440px){ .pair{grid-template-columns:minmax(0,1fr)} }
.forn-list{display:flex;flex-direction:column;gap:16px}
.forn-item{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.forn-item .forn-row{border:0;padding:0}
.perm{display:inline-flex;align-items:center;gap:4px;height:32px;font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px 40px}
.fgroup{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:2px}
.fgroup legend{font:700 11px/16px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--text2);padding:0;margin-bottom:8px}
.flag{display:flex;align-items:flex-start;gap:12px;padding:8px 0}
.flag.sub{padding-left:24px}
.flag .sw{margin-top:0}
.flag-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.flag-t label{font:400 14px/20px var(--font);color:var(--text);cursor:pointer}
.flag-t label.dim{color:var(--text3);cursor:default}
.sw[disabled]{opacity:.38;cursor:not-allowed}
.forn-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:12px 16px;align-items:start;padding-bottom:16px;border-bottom:1px solid var(--border)}
.forn-row.has-outra{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr) auto}
.forn-rm{margin-top:24px}

  /* ---- Gerador ---- */
  let genHTML = '';
  const G = S.gen;

    const list = genList(cfg), ex = new Set(cfg.agendas.map(g => agSig(cfg, g)));

    const horas = G.horas.map((h,i) => `<div class="sess"><span class="sess-n">${i+1}</span>

    </div>`;
  }

  /* ---- Agendas (cartões responsivos) ---- */
  const errs = agErrors(d), nErr = Object.keys(errs).length;
  const selIds = cfg.agendas.filter(g => S.sel[g.id]).map(g => g.id), nSel = selIds.length;

  const rows = cfg.agendas.map((g, i) => {

      <div class="field"><label for="pz-${g.id}-${k}-d">Data</label><input class="input num" type="date" id="pz-${g.id}-${k}-d" data-ag="${g.id}" data-pz="${k}" data-pf="d" value="${q.d||''}"></div>

    const detail = open ? `<section class="det" id="agd-${g.id}" aria-labelledby="agd-${g.id}-t">

      ${md ? `<div class="field"><span class="lbl" id="dias-${g.id}">Acontece nos dias</span><div class="wds" role="group" aria-labelledby="dias-${g.id}">${WK.map((f,w)=>`<button type="button" class="wd" data-action="agdia" data-ag="${g.id}" data-w="${w}" aria-pressed="${(g.dias||[]).includes(w)}" aria-label="${f}" ${lock?'disabled':''}>${WKA[w]}</button>`).join('')}</div><span class="help">De ${br(g.ini)} a ${br(g.fim)}, das ${g.hIni} às ${g.hFim}.</span></div>`
           : sf ? '' : `<p class="help">${ic('event_repeat','font-size:16px;vertical-align:-3px;margin-right:4px')}Para uma agenda que se repete, como uma oficina semanal, coloque o término em outra data e escolha os dias da semana aqui.</p>`}
      <div class="det-h"><b>Prazos desta agenda</b>${g.pz?`<button class="btn btn-ghost btn-sm" type="button" data-action="pzreset" data-ag="${g.id}">${ic('restart_alt')}Voltar ao padrão</button>`:'<span class="t-sub">Seguindo o padrão. Mude qualquer data para personalizar só esta agenda.</span>'}</div>
      <div class="pgrid">${pzInp('abre','Inscrições abrem')}${pzInp('encerra','Inscrições encerram', p.sf)}${pzInp('cancel','Cancelamento até')}
        ${(() => { const on = agRet(g), act = retOn(), own = g.retOn != null, r = g.ret || {}; return `<fieldset class="pgrp"><legend>Retirada de ingresso${on?' <span class="req" aria-hidden="true">*</span>':''}</legend>
          <div class="flag" style="padding:0 0 4px"><button type="button" role="switch" class="sw" id="agret-${g.id}" data-action="agret" data-ag="${g.id}" aria-checked="${on}" aria-describedby="agret-${g.id}-h"></button><div class="flag-t"><label for="agret-${g.id}">Haverá retirada de ingresso nesta agenda</label><span class="help" id="agret-${g.id}-h">${own ? (on ? 'Ativada só nesta agenda.' : 'Desativada só nesta agenda.') : (act ? 'Segue a atividade (ativada em Informações da agenda).' : 'Segue a atividade (desativada). Ligue para usar só nesta agenda.')}</span></div></div>
          ${on ? `<div class="pair">
          <div class="field"><label for="rtd-${g.id}-ini">Início</label><input class="input num" type="time" id="rtd-${g.id}-ini" data-ag="${g.id}" data-ret="ini" value="${r.ini||''}"></div>
          <div class="field"><label for="rtd-${g.id}-fim">Término</label><input class="input num" type="time" id="rtd-${g.id}-fim" data-ag="${g.id}" data-ret="fim" value="${r.fim||''}"></div></div>
          <span class="help">Quando o associado apresenta o QR Code e recebe o ingresso${g.ini ? ' em ' + br(g.ini) : ''}.</span>` : ''}
          ${own ? `<div><button class="btn btn-ghost btn-sm" type="button" data-action="agretx" data-ag="${g.id}">${ic('restart_alt')}Seguir a atividade</button></div>` : ''}</fieldset>`; })()}
</div>
      ${agCfgHTML(d, g)}
      <div class="det-f"><span class="t-sub">${ic('check','font-size:16px;vertical-align:-3px;margin-right:4px')}As alterações já valem para a agenda ${n}.</span>

        ${open?`<span class="badge b-edit">${ic('edit','font-size:14px')}Em edição</span>`:''}${cxBadges(g)}

          <div class="agc-of"><button type="button" role="switch" class="sw" id="sw-${g.id}" data-action="sw" data-ag="${g.id}" aria-checked="${!g.off}"></button><label for="sw-${g.id}" class="t-sub">${g.off?'Pausada':'Ativa'}<span class="sr"> · oferecer agenda ${n}</span></label></div>
          <button class="ibtn" type="button" data-action="agopen" data-ag="${g.id}" aria-expanded="${open}" aria-controls="agd-${g.id}" aria-label="${open?'Fechar':'Abrir'} detalhes da agenda ${n}" title="Detalhes e prazos">${ic(open?'expand_less':'tune')}</button>
          <button class="ibtn" type="button" data-action="dupag" data-ag="${g.id}" aria-label="Duplicar agenda ${n} para a semana seguinte" title="Duplicar +7 dias">${ic('content_copy')}</button>
          <button class="ibtn danger" type="button" data-action="rmag" data-ag="${g.id}" aria-label="Remover agenda ${n}" title="Remover agenda">${ic('delete')}</button>
        </div>
      </div>
      <div class="agc-grid">
        ${sf ? `<div class="field"><label for="ag-${g.id}-ini">Começa em <span class="req" aria-hidden="true">*</span><span class="sr"> (agenda ${n})</span></label><input class="input num" type="date" id="ag-${g.id}-ini" data-ag="${g.id}" data-agf="ini" value="${esc(g.ini||'')}" ${lock?'disabled':''}><span class="t-sub">Sem data fim</span></div>
        <div class="field agc-dt"><span class="lbl" aria-hidden="true">Horário <span class="req">*</span></span><div class="dt2">${dInp('hIni','time',g.hIni,'Horário de início')}${dInp('hFim','time',g.hFim,'Horário de término')}</div></div>
        <div class="field agc-wd"><span class="lbl" id="dias-${g.id}">Dias da semana <span class="req" aria-hidden="true">*</span></span><div class="wds" role="group" aria-labelledby="dias-${g.id}">${WK.map((f,w)=>`<button type="button" class="wd" data-action="agdia" data-ag="${g.id}" data-w="${w}" aria-pressed="${(g.dias||[]).includes(w)}" aria-label="${f}" ${lock?'disabled':''}>${WKA[w]}</button>`).join('')}</div></div>`
        : `<div class="field agc-dt"><span class="lbl" aria-hidden="true">Início</span><div class="dt2">${dInp('ini','date',g.ini,'Data de início')}${dInp('hIni','time',g.hIni,'Horário de início')}</div></div>
        <div class="field agc-dt"><span class="lbl" aria-hidden="true">Término</span><div class="dt2">${cd ? `<label class="sr" for="ag-${g.id}-fim">Data de término da agenda ${n}</label><input class="input num" type="date" id="ag-${g.id}-fim" value="${esc(g.fim||'')}" disabled aria-describedby="ag-${g.id}-fim-h">` : dInp('fim','date',g.fim,'Data de término')}${dInp('hFim','time',g.hFim,'Horário de término')}</div>${cd ? `<span class="help" id="ag-${g.id}-fim-h">Calculado pela duração da corrida: ${cd} ${cd===1?'dia':'dias'}.</span>` : ''}</div>`}
        ${ad.map(dm => { const v = g.vals[dm.k] || ''; const okv = cfg.vals[dm.k].includes(v);
          return `<div class="field"><label for="ag-${g.id}-v-${dm.k}">${dm.label}<span class="sr"> da agenda ${n}</span></label><select class="input" id="ag-${g.id}-v-${dm.k}" data-ag="${g.id}" data-agf="v:${dm.k}" ${lock?'disabled':''} aria-invalid="${!okv}">${okv?'':'<option value="">Escolha</option>'}${cfg.vals[dm.k].map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}</select></div>`; }).join('')}
        <div class="field"><label for="ag-${g.id}-vagas">Vagas<span class="sr"> da agenda ${n}</span></label><input class="input num" id="ag-${g.id}-vagas" type="number" min="0" inputmode="numeric" value="${g.vagas}" data-ag="${g.id}" data-agf="vagas" ${g.off?'disabled':''} aria-invalid="${capOf(g) < (g.occ||0)}">${g.occ?`<span class="t-sub">${fmt(g.occ)} inscritos</span>`:''}</div>
        <div class="field"><label for="ag-${g.id}-exc">Excedente<span class="sr"> em porcentagem da agenda ${n}</span></label><div class="pct"><input class="input num" id="ag-${g.id}-exc" type="number" min="0" max="100" step="1" inputmode="numeric" value="${+g.exc||0}" data-ag="${g.id}" data-agf="exc" ${g.off?'disabled':''} aria-invalid="${(+g.exc||0)>100}" aria-describedby="ag-${g.id}-exch"><span aria-hidden="true">%</span></div>
          <span class="t-sub num" id="ag-${g.id}-exch">${+g.exc ? `+${fmt(extraOf(g))} · ${fmt(capOf(g))} ingressos` : 'Sem excedente'}</span></div>
        ${agRet(g) ? `<div class="field agc-dt"><span class="lbl" id="rt-${g.id}-l">Retirada de ingresso <span class="req" aria-hidden="true">*</span></span><div class="dt2" role="group" aria-labelledby="rt-${g.id}-l">
          <label class="sr" for="rt-${g.id}-ini">Início da retirada de ingresso da agenda ${n}</label><input class="input num" type="time" id="rt-${g.id}-ini" data-ag="${g.id}" data-ret="ini" value="${(g.ret&&g.ret.ini)||''}" aria-invalid="${!(g.ret&&g.ret.ini)}">
          <label class="sr" for="rt-${g.id}-fim">Término da retirada de ingresso da agenda ${n}</label><input class="input num" type="time" id="rt-${g.id}-fim" data-ag="${g.id}" data-ret="fim" value="${(g.ret&&g.ret.fim)||''}" aria-invalid="${!(g.ret&&g.ret.fim) || (g.ret.ini && g.ret.fim <= g.ret.ini)}"></div></div>` : ''}
        <div class="field agc-pz"><span class="lbl">Inscrições e cancelamento</span><button type="button" class="pzbtn" data-action="agopen" data-ag="${g.id}" aria-expanded="${open}" aria-controls="agd-${g.id}" aria-label="Prazos da agenda ${n}: inscrições ${p.sf ? `abertas a partir de ${brs(p.abre.d)} ${p.abre.h}, sem encerramento, cancelamento até ${brs(p.cancel.d)} ${p.cancel.h}` : `de ${brs(p.abre.d)} ${p.abre.h} a ${brs(p.encerra.d)} ${p.encerra.h}`}. ${g.pz?'Personalizado':'Padrão'}. Abrir detalhes">
          ${p.sf ? `<span class="num">Abertas desde ${brs(p.abre.d)} ${p.abre.h}</span>
          <span class="t-sub num">Sem encerramento · Cancela até ${p.cancel.d?brs(p.cancel.d)+' '+p.cancel.h:'—'}${agRet(g)&&g.ret&&g.ret.ini&&g.ret.fim?` · Retirada ${g.ret.ini} às ${g.ret.fim}`:''}</span>
          ${g.pz?badge('Personalizado','b-info'):badge('Padrão','b-neu')}` : p.rec ? `<span class="num">Abertas desde ${brs(p.abre.d)} ${p.abre.h}</span>
          <span class="t-sub">Inscrição até ${hLbl(p.encH)} e cancelamento até ${hLbl(p.cancH)} antes de cada encontro${agRet(g)&&g.ret&&g.ret.ini&&g.ret.fim?` · Retirada ${g.ret.ini} às ${g.ret.fim}`:''}</span>
          ${badge('Recorrente','b-info')}` : `<span class="num">${brs(p.abre.d)} ${p.abre.h} → ${brs(p.encerra.d)} ${p.encerra.h}</span>
          <span class="t-sub num">Cancela até ${p.cancel.d?brs(p.cancel.d)+' '+p.cancel.h:'—'}${agRet(g)&&g.ret&&g.ret.ini&&g.ret.fim?` · Retirada ${g.ret.ini} às ${g.ret.fim}`:''}</span>
          ${g.pz?badge('Personalizado','b-info'):badge('Padrão','b-neu')}`}</button></div>
      </div>
      ${md?`<span class="t-sub agc-rep">${ic('event_repeat','font-size:14px;vertical-align:-2px;margin-right:4px')}${(g.dias||[]).length?'Repete: '+diasLbl(g):'Sem dias da semana definidos'}</span>`:''}
      ${e?`<p class="err agc-err">${ic('error')}<span>${esc(e.join(' '))}</span></p>`:''}
      ${detail}

function addTag(){

  if (!v) S.errors.tag = 'Escreva o nome da tag.';
  else if (v.length > 30) S.errors.tag = 'Use até 30 caracteres.';

  else { d.tags.push(v); S.tagIn = ''; }

  if (!S.errors.tag) snack(`Tag "${v}" incluída.`);
}

function validate1(){
  const d = S.draft; S.errors = {};

  d.catRules.forEach((r,i) => { if (!r.cat) S.errors[`cr-${i}-cat`] = 'Escolha a categoria.'; if (!r.regra) S.errors[`cr-${i}-regra`] = 'Escolha a regra de utilização.'; });
  if (!d.catRules.length) S.errors.cats = 'Adicione ao menos uma categoria.';
  if ((d.docs||[]).some(x => !docDone(x))) S.errors.docs = 'Aguarde o envio dos documentos terminar.';
  else if (!(d.docs||[]).length) S.errors.docs = 'Envie ao menos um documento. O regulamento é obrigatório.';
  else if (!hasReg(d)) S.errors.docs = 'Envie o regulamento da atividade. Ele é obrigatório.';
  if (d.kit === 'Sim' && !d.kitSel) S.errors.kitSel = 'Escolha o kit que será entregue.';
  if (d.kit === 'Sim' && !kitModoOf(d)) S.errors.kitModo = 'Escolha se o kit será retirado ou enviado.';
  if (d.kit === 'Sim' && kitModoOf(d) === 'Retirada') kitLocsOf(d).forEach((v,i) => { if (!v) S.errors[`kl-${i}`] = 'Escolha o local de retirada.'; });
  if (d.kit === 'Sim' && kitModoOf(d) === 'Envio') { const T = d.transps = transpsOf(d);
    T.forEach((r,i) => { if (!r.transp) S.errors[`kt-${i}-t`] = 'Escolha a transportadora.'; if (!r.prio) S.errors[`kt-${i}-p`] = 'Escolha a prioridade.'; else if (T.some((x,j) => j < i && x.prio === r.prio)) S.errors[`kt-${i}-p`] = 'Outra transportadora já usa esta prioridade.'; }); }
  d.forn.forEach((x,i) => {
    if (!x.funcao) S.errors[`forn-${i}-funcao`] = 'Escolha o tipo de serviço.';
    else if (x.funcao === 'Outra' && !(x.outra||'').trim()) S.errors[`forn-${i}-outra`] = 'Descreva o serviço.';
    if (x.funcao && !x.nome) S.errors[`forn-${i}-nome`] = 'Escolha o colaborador.';
    if (!x.perm) S.errors[`forn-${i}-perm`] = 'Escolha o acesso do colaborador.';
  });
  return !Object.keys(S.errors).length;
}
function commit(status){
  const d = S.draft;

  else { const i = S.acts.findIndex(a=>a.id===d.id); S.acts[i] = d; }

}
function blockedBy(pred, what){
  const hit = combos(S.draft.cfg).filter(pred).filter(c => c.occ > 0);
  if (!hit.length) return false;
  const n = hit.reduce((s,c)=>s+c.occ,0);
  snack(`${what} tem ${fmt(n)} inscritos. Pause as agendas em vez de remover.`);
  return true;
}

  const opts = ad.map(x=>[x.k, x.label]).concat([['data', cfg.mode==='avulsas'?'Data':'Dia'],['agenda','Agenda']]);
  if (!opts.some(o=>o[0]===S.insBy)) S.insBy = opts[0][0];

    return {label, o, t, p, st, cls};

    case 'rmgr': { const id = b.dataset.ag, L = clone(grOf(cxGet(id))); const [r] = L.splice(+b.dataset.i, 1); cxSet(id, {gratRules: L}); render(); snack(`Gratuidade ${r.tipo || ''} removida.`.replace('  ', ' ')); { const el = document.querySelector(`[data-action="addgr"][data-ag="${id}"]`); el && el.focus(); } break; }
    case 'agret': { const g = findAg(b.dataset.ag); if (!g) break; const v = !agRet(g); g.retOn = v === retOn() ? null : v;
      if (v && (!g.ret || !g.ret.ini)) g.ret = {ini: g.hIni ? minus(g.hIni, 120) : '', fim: g.hIni || ''};
      render(); { const el = document.getElementById(`agret-${g.id}`); el && el.focus(); } break; }
    case 'agretx': { const g = findAg(b.dataset.ag); if (g) g.retOn = null; render(); { const el = document.getElementById(`agret-${b.dataset.ag}`); el && el.focus(); } break; }
    case 'addfx': { const g = findAg(b.dataset.ag); if (!g) break; g.fornX = [...(g.fornX||[]), {funcao:'', nome:'', perm:'', ed:true, on:true}]; render(); { const el = document.getElementById(`fx-${g.id}-${g.fornX.length-1}-funcao`); el && el.focus(); } break; }
    case 'okfx': { const g = findAg(b.dataset.ag); const fx = g && g.fornX[+b.dataset.i]; if (!fx || !(fx.funcao && fx.nome && fx.perm)) break; fx.ed = false; render(); snack(`${fx.nome} incluído nesta agenda.`); { const el = document.querySelector(`[data-action="addfx"][data-ag="${g.id}"]`); el && el.focus(); } break; }
    case 'edfx': { const g = findAg(b.dataset.ag); const fx = g && g.fornX[+b.dataset.i]; if (!fx) break; fx.ed = true; render(); { const el = document.getElementById(`fx-${g.id}-${b.dataset.i}-funcao`); el && el.focus(); } break; }
    case 'rmfx': { const g = findAg(b.dataset.ag); if (!g) break; const [x] = g.fornX.splice(+b.dataset.i, 1); render(); snack(`${x.nome || 'Colaborador'} removido desta agenda.`); { const el = document.querySelector(`[data-action="addfx"][data-ag="${g.id}"]`); el && el.focus(); } break; }
    case 'agren': { S.agRen = b.dataset.ag; render(); { const el = document.getElementById(`agn-${b.dataset.ag}`); el && (el.focus(), el.select()); } break; }
    case 'agrenok': { const g = findAg(b.dataset.ag), el = document.getElementById(`agn-${b.dataset.ag}`); if (g && el) g.nome = el.value.trim(); S.agRen = null; render(); { const bt = document.querySelector(`[data-action="agren"][data-ag="${b.dataset.ag}"]`); bt && bt.focus(); } snack(g && g.nome ? `Agenda renomeada para "${g.nome}".` : 'A agenda voltou ao nome padrão.'); break; }
    case 'agrenx': { S.agRen = null; render(); { const bt = document.querySelector(`[data-action="agren"][data-ag="${b.dataset.ag}"]`); bt && bt.focus(); } break; }
    case 'agopen': { const id = b.dataset.ag, closing = !!S.agOpen[id]; S.agOpen[id] = !closing; render();
      const card = document.getElementById(`agc-${id}`);
      if (card) { if (closing) { card.scrollIntoView({block:'nearest'}); const t = card.querySelector('[data-action="agopen"].ibtn'); t && t.focus({preventScroll:true}); }
        else { const h = document.getElementById(`agd-${id}-t`); h && h.setAttribute('tabindex','-1'); card.scrollIntoView({block:'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); } }
      break; }
    case 'agdia': { const g = findAg(b.dataset.ag), w = +b.dataset.w; g.dias = (g.dias||[]).includes(w) ? g.dias.filter(x=>x!==w) : [...(g.dias||[]), w]; render(); break; }
    case 'pzreset': { const g = findAg(b.dataset.ag); g.pz = null; render(); snack('A agenda voltou a seguir os prazos padrão.'); break; }
    case 'bk-vagas': { const v = parseInt(document.getElementById('bk-v').value,10); if (isNaN(v) || v < 0) { snack('Informe o número de vagas.'); document.getElementById('bk-v').focus(); break; }
      const gs = selAgs(); gs.forEach(g => { g.vagas = v; }); render(); snack(`${v} vagas aplicadas a ${gs.length} ${gs.length===1?'agenda':'agendas'}.`); break; }
    case 'addcat': { const free = CATS.filter(c => !catsOf(d).includes(c)); d.catRules.push({cat:'', regra:''}); render(); { const el = document.getElementById(`cr-${d.catRules.length-1}-cat`); el && el.focus(); } break; }
    case 'rmcat': { if (d.catRules.length === 1) break; d.catRules.splice(+b.dataset.i, 1); Object.keys(S.errors).filter(k=>k.startsWith('cr-')).forEach(k=>delete S.errors[k]); render(); break; }
    case 'bk-exc': { const v = parseInt(document.getElementById('bk-x').value,10); if (isNaN(v) || v < 0 || v > 100) { snack('Informe um excedente entre 0% e 100%.'); document.getElementById('bk-x').focus(); break; }
      const gs = selAgs(); gs.forEach(g => { g.exc = v; }); render(); snack(`Excedente de ${v}% aplicado a ${gs.length} ${gs.length===1?'agenda':'agendas'}.`); break; }
    case 'bk-hora': { const hi = document.getElementById('bk-hi').value, hf = document.getElementById('bk-hf').value;
      if (!hi) { snack('Informe ao menos o horário de início.'); document.getElementById('bk-hi').focus(); break; }
      const gs = selAgs().filter(g => !g.occ); gs.forEach(g => { g.hIni = hi; if (hf) g.hFim = hf; });
      const skip = selAgs().length - gs.length; render(); snack(`Horário aplicado a ${gs.length} ${gs.length===1?'agenda':'agendas'}.${skip?` ${skip} com inscritos ficaram como estavam.`:''}`); break; }
    case 'bk-pz': { const gs = selAgs(); gs.forEach(g => { g.pz = null; }); render(); snack(`${gs.length} ${gs.length===1?'agenda voltou':'agendas voltaram'} aos prazos padrão.`); break; }
    case 'bk-dup': { const gs = selAgs(); const nw = []; gs.forEach(x => nw.push(nextFree(cfg, x, nw))); cfg.agendas.push(...nw); sortAg(cfg); S.sel = {}; nw.forEach(g => { S.sel[g.id] = true; });
      render(); snack(`${nw.length} ${nw.length===1?'agenda criada':'agendas criadas'} na semana seguinte. Elas ficaram selecionadas para repetir de novo.`); break; }
    case 'bk-off': { const gs = selAgs(); const allOff = gs.every(g => g.off); gs.forEach(g => { g.off = !allOff; }); render(); snack(allOff ? 'Agendas ativadas.' : 'Agendas pausadas.'); break; }
    case 'bk-rm': { const gs = selAgs(), free = gs.filter(g => !g.occ), lock = gs.length - free.length;
      if (!free.length) { snack('As agendas selecionadas têm inscritos. Pause em vez de remover.'); break; }
      confirmDlg({title:`Remover ${free.length} ${free.length===1?'agenda':'agendas'}?`, text:`As agendas selecionadas saem da atividade.${lock?` ${lock} com inscritos ${lock===1?'fica':'ficam'} e pode${lock===1?'':'m'} ser pausada${lock===1?'':'s'}.`:''}`, confirm:'Remover agendas',
        onOk:() => { const ids = new Set(free.map(g=>g.id)); cfg.agendas = cfg.agendas.filter(g => !ids.has(g.id)); S.sel = {}; render(); snack(`${free.length} ${free.length===1?'agenda removida':'agendas removidas'}.`); }}); break; }
    case 'bk-clear': S.sel = {}; render(); break;
    case 'gen': { if (S.gen) { S.gen = null; render(); break; }
      S.gen = {dates:[], horas:[{ini:'20:00', fim:'22:00'}], vals:Object.fromEntries(activeDims(cfg).map(dm => [dm.k, [...cfg.vals[dm.k]]])), vagas:cfg.defaultVagas, exc:cfg.defaultExc||0};
      const f = cfg.agendas.map(g=>g.ini).filter(Boolean).sort().pop(); const base = f && f >= TODAY ? f : addDays(TODAY, 14); S.month = {y:+base.slice(0,4), m:+base.slice(5,7)-1}; S.gen.start = addDays(base, f && f >= TODAY ? 1 : 0);
      render(); { const el = document.getElementById('gen-t'); el && el.scrollIntoView({block:'nearest'}); } break; }
    case 'gday': { const iso = b.dataset.iso, G = S.gen; G.dates = G.dates.includes(iso) ? G.dates.filter(x=>x!==iso) : [...G.dates, iso]; render(); break; }
    case 'ghadd': { const G = S.gen, used = G.horas.map(h=>h.ini), ini = PRESETS.find(p=>!used.includes(p)) || '12:00'; G.horas.push({ini, fim:plus2(ini)}); render(); break; }
    case 'gwd': { const G = S.gen, w = +b.dataset.w; G.dias = (G.dias||[]).includes(w) ? G.dias.filter(x=>x!==w) : [...(G.dias||[]), w].sort((a,b)=>a-b); render(); { const el = document.querySelector(`[data-action="gwd"][data-w="${w}"]`); el && el.focus(); } break; }
    case 'ghrm': S.gen.horas.splice(+b.dataset.i, 1); render(); break;
    case 'gval': { const G = S.gen, k = b.dataset.k, v = b.dataset.v; const cur = G.vals[k] || []; G.vals[k] = cur.includes(v) ? cur.filter(x=>x!==v) : [...cur, v]; render(); break; }
    case 'gcreate': { const list = genList(cfg), ex = new Set(cfg.agendas.map(g => agSig(cfg, g))); const add = list.filter(c => !ex.has(agSig(cfg, c)));
      add.forEach(c => { const g = {id:uid(), ...c, dias:[], vagas:S.gen.vagas, exc:S.gen.exc||0, occ:0, off:false, pz:null}; if (flagOn(d, 'semFim')) { g.fim = ''; g.dias = [...(S.gen.dias||[])]; } cfg.agendas.push(g); });
      sortAg(cfg); S.gen = null; render(); snack(`${add.length} ${add.length===1?'agenda criada':'agendas criadas'} com prazos padrão.`); break; }
    case 'savedraft': { if (!validate1()) { S.step = 1; render(); break; } const a = commit('rascunho'); S.draft = null; go('lista'); snack(`Rascunho salvo com ${stats(a).n} agendas.`); break; }
    case 'publish': { const wasPub = d.status === 'publicada'; const a = commit('publicada'); S.draft = null; go('lista');
      snack(wasPub ? 'Alterações salvas.' : `Atividade publicada com ${stats(a).n} agendas.`, ['Ver inscrições','insLast']); S._last = a.id; break; }
    case 'insLast': $('#snack').hidden = true; S.insId = S._last; S.insBy = null; S.insOpt = ''; go('inscricoes'); break;
  }
});

render();
})();
